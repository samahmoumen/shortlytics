apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortlytics-chart.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    environment: {{ .Values.global.environment | default "dev" }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "shortlytics-chart.fullname" . }}-backend-sa
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_URL
              value: "jdbc:postgresql://{{ .Values.db.server }}:5432/{{ .Values.db.name }}"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "shortlytics-chart.fullname" . }}-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shortlytics-chart.fullname" . }}-db-secret
                  key: POSTGRES_PASSWORD
          # TEMPORARY: TCP probes while /actuator/health/** returns 403.
          # Revert to httpGet on /actuator/health/liveness and /readiness
          # once the security config permits those paths.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3