apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortlytics-chart.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    environment: {{ .Values.global.environment | default "dev" }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "shortlytics-chart.fullname" . }}-backend-sa
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 1. URL JDBC attendue par Spring Boot dans ton application.properties
            - name: DB_URL
              value: "jdbc:postgresql://{{ .Values.backend.db.server }}:5432/{{ .Values.backend.db.name }}"
            
            # 2. Utilisateur & Mot de passe issus du secret généré par ESO
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "shortlytics-chart.fullname" . }}-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shortlytics-chart.fullname" . }}-db-secret
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10