global:
  environment: dev
  azure:
    tenantId: "a99950fd-2582-4f30-916e-fc061b7a258b"
    keyVaultName: "shortlytics-dev-kv"
    workloadIdentityClientId: "2cc7405f-d5d4-45ac-adfe-63a485994f84"
  imageRegistry: shortlyticsdevacrsbun.azurecr.io
ingress:
  host: "dev.shortlytics.internal"
# Surcharge des valeurs du sous-chart Backend
backend:
  image:
    repository: shortlytics-backend
    tag: "813bbb3"
    pullPolicy: Always
  db:
    server: "shortlytics-dev-postgres"
    name: "shortlytics-dev-db"
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 250m
      memory: 384Mi
# Surcharge des valeurs du sous-chart Frontend
frontend:
  image:
    repository: shortlytics-frontend
    tag: "813bbb3"
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
postgres:
  database: "shortlytics-dev-db"
  storageSize: 2Gi
