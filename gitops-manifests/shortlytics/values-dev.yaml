global:
  environment: dev
  azure:
    tenantId: "a99950fd-2582-4f30-916e-fc061b7a258b"
    keyVaultName: "shortlytics-dev-kv"
    workloadIdentityClientId: "fea7353b-2637-4880-aa0e-daf77ee79cec"
  imageRegistry: shortlyticsdevacrr6zn.azurecr.io
  ingressHost: "dev.shortlytics.internal"
ingress:
  host: "dev.shortlytics.internal"
# Surcharge des valeurs du sous-chart Backend
backend:
  image:
    repository: shortlytics-backend
    tag: "1718689"
    pullPolicy: Always
  db:
    server: "shortlytics-dev-postgres"
    name: "shortlytics-dev-db"
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 250m
      memory: 384Mi
# Surcharge des valeurs du sous-chart Frontend
frontend:
  image:
    repository: shortlytics-frontend
    tag: "1718689"
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
postgres:
  database: "shortlytics-dev-db"
  storageSize: 2Gi
