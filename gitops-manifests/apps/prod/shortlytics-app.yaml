apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortlytics-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/samahmoumen/shortlytics.git'
    targetRevision: main
    path: gitops-manifests/shortlytics 
    helm:
      releaseName: shortlytics-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shortlytics-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true